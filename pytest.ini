[pytest]
# Fast default:  python -m pytest -q tests -n auto      (pytest-xdist, in requirements.txt)
# Timing gates:  python -m pytest -q tests -m perf      (serially, on an otherwise idle machine)
addopts = -m "not perf"
markers =
    perf: wall-clock budgets; parallel workers or a busy machine make them fail, so run them alone with -m perf
